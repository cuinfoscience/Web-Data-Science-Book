on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.qmd"
      - "_quarto.yml"
      - "references.bib"
      - ".github/workflows/render.yml"

name: Render (PR check)

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Jupyter
        run: python -m pip install jupyter

      - name: Render Quarto project
        # Not the quarto-actions/render wrapper: it just runs `quarto
        # render` and checks its exit code, which stays 0 even when a
        # chapter has a broken @sec- crossref -- verified directly by
        # breaking one and rendering. Crossrefs only resolve when the
        # whole book renders together (a single changed chapter rendered
        # alone always shows "unable to resolve" for every crossref it
        # makes, whether or not the target is real), so this always
        # renders the full project and greps its own output for the
        # "WARN:" that a broken crossref actually produces.
        run: |
          quarto render > render.log 2>&1
          EXIT=$?
          cat render.log
          if [ $EXIT -ne 0 ]; then
            echo "::error::quarto render failed (exit $EXIT)"
            exit 1
          fi
          if grep -q "WARN:" render.log; then
            echo "::error::quarto render produced warnings -- likely a broken @sec- crossref. See the log above."
            exit 1
          fi
          echo "Book rendered cleanly, no warnings."
