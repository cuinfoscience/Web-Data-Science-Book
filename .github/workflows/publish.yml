on:
  workflow_dispatch:
  push:
    branches: [main]

name: Render and Publish

# Two pushes to main close together used to build the gh-pages worktree from the
# same parent commit and then race to push it. The loser failed with
# "cannot lock ref 'refs/heads/gh-pages'" and the site silently stayed a commit
# behind. Serialize the runs instead. cancel-in-progress is false so a build that
# is already publishing finishes; a run still waiting is superseded by the newer
# commit, which contains its changes anyway.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Jupyter
        run: python -m pip install jupyter

      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
