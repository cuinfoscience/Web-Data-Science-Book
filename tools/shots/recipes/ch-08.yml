# Recipes for Chapter 8's figures (ch-08-dynamic-pages.qmd). See tools/shots/README.md.
#
# Every figure here shows browser UI (View Source, DevTools, the Chrome for
# Testing window, the Playwright Inspector) or joins two captures. The headed
# ones run on a virtual display; the composite captures its two parts headless
# and joins them. The two whose subject is a tool itself (the window Selenium
# opens, Playwright's recorder) need that tool as the engine and wait for a
# later milestone (M4). `legacy:` records how each image was made.
# quotes.toscrape.com is a sandbox built for scraping practice and has no
# robots.txt.
chapter: ch-08
qmd: ch-08-dynamic-pages.qmd
defaults:
  window: [1280, 800]
  scale: 2

figures:
  - id: view-source-js
    kind: capture
    section: "Check 1: View Source"
    brief: >-
      Show that the page's source has no quote markup, yet the quotes are there, in
      a script, as `var data = [...]`. From the top of the source through line 43:
      the header, the script tags, and the first quote object, and nothing below.
    url: view-source:https://quotes.toscrape.com/js/
    mode: headed
    window: [1100, 1000]
    steps:
      - wait: {text: 'var data'}
    crop: {between: ['body', 'td.line-number[value="43"]']}   # from the top of the source through line 43
    legacy:
      captured: 2026-09-22
      method: Chrome for Testing 154 driven by Selenium 4.49, headed on a virtual display (Xvfb), View Source grabbed with ImageMagick import; the top of the source through line 43
      note: The quotes sit in a script element as `var data = [...]`.

  - id: javascript-off-on
    kind: capture
    section: "Check 2: Turn JavaScript Off"
    brief: >-
      Show the same page with JavaScript off and on, side by side and labeled: off
      has only the title, Login, Next, and the footer; on has the quotes. The
      lesson is the empty page beside the full one, so its words need not be
      legible.
    url: https://quotes.toscrape.com/js/
    mode: composite     # the page with JavaScript off, then on, side by side, labeled
    window: [900, 695]
    parts:
      - label: JavaScript off
        javascript: false
        steps: [{wait: {text: 'Quotes to Scrape'}}]
      - label: JavaScript on
        steps: [{wait: {text: 'Albert Einstein'}}]
    layout: {gap: 28, pad: 15, label_px: 28}
    legibility: {skip: "the lesson is the empty page beside the full one, not the words"}
    legacy:
      captured: 2026-09-22
      method: two captures of the same page, JavaScript disabled and enabled, joined side by side and labeled

  - id: network-tab-json
    kind: capture
    section: "Check 3: Watch the Network Tab"
    brief: >-
      Show the JSON a scrolling page loads: the Network tab filtered to Fetch/XHR
      after three scrolls, listing quotes?page=1 through page=4, with page 2's
      Preview open to its first quote (author, tags, text). DevTools alone; the
      page adds nothing here.
    url: https://quotes.toscrape.com/scroll
    mode: headed
    # DevTools alone, 800×600, as ch-05's network-headers: a 1000-pixel window lets docked
    # DevTools be 600 tall, and the crop keeps only DevTools. The page scrolls out of view.
    window: [800, 1000]
    devtools: {dock: bottom, size: 600, zoom: 1.25, panel: network, overview: false}
    steps:
      - wait: {text: 'Albert Einstein'}
      - devtools_click: {text: '^Fetch/XHR$'}
      # Each scroll to the bottom makes the page ask its API for the next page.
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=2'}
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=3'}
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=4'}
      - devtools_click: {text: '^quotes\?page=2$'}
      - devtools_click: {text: '^Preview$'}
      # Open the quotes array and its first quote, as the chapter's figure does.
      - devtools_click: {text: '^quotes\s*:', at: [0.03, 0.5]}
      - devtools_click: {text: '^0\s*:', at: [0.05, 0.5]}
    crop: {devtools: true}
    drifts: false

  - id: selenium-chrome-for-testing
    kind: capture
    section: "Setting Up Selenium"
    brief: >-
      Show the window webdriver.Chrome() opens on a machine with no Chrome, after
      Selenium Manager downloaded Chrome for Testing. Its "only for automated
      testing" bar is the point, so this is the one figure that keeps it. Any
      page will do; xkcd is the page the chapter's lab uses.
    url: https://xkcd.com/
    mode: headed        # the subject is the window Selenium opens, including its automation bar
    engine: selenium
    # The one figure that keeps Chrome for Testing's "only for automated testing" notice: the
    # caption and alt text point at it. When the selenium engine arrives, it expects the bar.
    expect: {infobar: true}
    drifts: true        # xkcd's current comic and the browser version
    legacy:
      captured: 2026-09-22
      method: webdriver.Chrome() with Selenium 4.49 on a machine with no Chrome; Selenium Manager downloaded Chrome for Testing 154; headed on Xvfb, grabbed with ImageMagick import
      note: The comic was Stargazing 5; its hover text shows because the pointer rested on it.

  - id: xkcd-inspect
    kind: capture
    section: "Extracting Data"
    brief: >-
      Show where the comic's hover joke and name live: the Elements tree with the
      comic's <img> selected inside div#comic, its title and alt attributes
      wrapped in full, down to the breadcrumb bar. Leave out the page and the
      Styles pane.
    url: https://xkcd.com/
    mode: headed
    # DevTools alone, 800×600, as network-tab-json: the Elements tree gets the whole width,
    # so the selected <img> row shows its title and alt attributes wrapped in full.
    window: [800, 1000]
    devtools: {dock: bottom, size: 600, zoom: 1.25, layout: stacked, sidebar: 1}
    steps:
      - wait: {selector: '#comic img'}
      - inspect: {selector: '#comic img', selects: '^<img'}
    # DevTools starts 600 pixels up a 1000-pixel window. 530 keeps the breadcrumb bar, the
    # <img>'s path, and stops above the Styles pane that DevTools won't hide.
    crop: {top: 400, height: 530}
    drifts: true

  - id: playwright-codegen
    kind: capture
    section: "Recording a Script with Codegen"
    brief: >-
      Show codegen turning clicks into code: the recording browser on the left,
      after two clicks (the tag "change", then an "(about)" link), with the
      locator tooltip over the author's name; the Inspector on the right with
      the Python it wrote.
    url: https://quotes.toscrape.com/
    mode: headed        # two windows: the browser and the Playwright Inspector
    engine: codegen
    legacy:
      captured: 2026-09-22
      method: playwright codegen --target python (Playwright 1.63, its bundled Chrome for Testing 153), headed on Xvfb, grabbed with ImageMagick import
      note: After two recorded clicks (the tag "change", then an "(about)" link), hovering the author's name shows the locator codegen would use.
