# Recipes for Chapter 8's figures (ch-08-dynamic-pages.qmd). See tools/shots/README.md.
#
# Every figure here shows browser UI (View Source, DevTools, the Chrome for
# Testing window, the Playwright Inspector) or joins two captures, so none is
# captured headless. The headed ones run on a virtual display (milestone M2);
# the two whose subject is a tool itself (the window Selenium opens, Playwright's
# recorder) need that tool as the engine and wait for a later milestone, as does
# the side-by-side composite (M3). `legacy:` records how each image was made.
# quotes.toscrape.com is a sandbox built for scraping practice and has no
# robots.txt.
chapter: ch-08
qmd: ch-08-dynamic-pages.qmd
defaults:
  window: [1280, 800]
  scale: 2

figures:
  - id: view-source-js
    kind: capture
    section: "Check 1: View Source"
    url: view-source:https://quotes.toscrape.com/js/
    mode: headed
    window: [1100, 1000]
    steps:
      - wait: {text: 'var data'}
    crop: {between: ['body', 'td.line-number[value="43"]']}   # from the top of the source through line 43
    legacy:
      captured: 2026-09-22
      method: Chrome for Testing 154 driven by Selenium 4.49, headed on a virtual display (Xvfb), View Source grabbed with ImageMagick import; the top of the source through line 43
      note: The quotes sit in a script element as `var data = [...]`.

  - id: javascript-off-on
    kind: capture
    section: "Check 2: Turn JavaScript Off"
    url: https://quotes.toscrape.com/js/
    mode: composite     # the page with JavaScript off, then on, side by side, labeled
    legacy:
      captured: 2026-09-22
      method: two captures of the same page, JavaScript disabled and enabled, joined side by side and labeled

  - id: network-tab-json
    kind: capture
    section: "Check 3: Watch the Network Tab"
    url: https://quotes.toscrape.com/scroll
    mode: headed
    window: [1680, 1000]
    devtools: {dock: right, panel: network}
    steps:
      - wait: {text: 'Albert Einstein'}
      - devtools_click: {text: '^Fetch/XHR$'}
      # Each scroll to the bottom makes the page ask its API for the next page.
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=2'}
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=3'}
      - scroll: {y: 20000}
      - devtools_wait: {text: 'quotes\?page=4'}
      - devtools_click: {text: '^quotes\?page=2$'}
      - devtools_click: {text: '^Preview$'}
      # Open the quotes array and its first quote, as the chapter's figure does.
      - devtools_click: {text: '^quotes\s*:', at: [0.03, 0.5]}
      - devtools_click: {text: '^0\s*:', at: [0.05, 0.5]}
    crop: {top: 0, height: 680}
    drifts: false
    legacy:
      captured: 2026-09-22
      method: Chrome for Testing 154 driven by Selenium 4.49, headed on Xvfb, DevTools docked right and operated with real clicks (xdotool), grabbed with ImageMagick import
      note: After scrolling, the Fetch/XHR filter lists quotes?page=1 to page=4; Preview shows page 2's JSON.

  - id: selenium-chrome-for-testing
    kind: capture
    section: "Setting Up Selenium"
    url: https://xkcd.com/
    mode: headed        # the subject is the window Selenium opens, including its automation bar
    engine: selenium
    drifts: true        # xkcd's current comic and the browser version
    legacy:
      captured: 2026-09-22
      method: webdriver.Chrome() with Selenium 4.49 on a machine with no Chrome; Selenium Manager downloaded Chrome for Testing 154; headed on Xvfb, grabbed with ImageMagick import
      note: The comic was Stargazing 5; its hover text shows because the pointer rested on it.

  - id: xkcd-inspect
    kind: capture
    section: "Extracting Data"
    url: https://xkcd.com/
    mode: headed
    window: [1680, 1000]
    devtools: {dock: right, panel: elements}
    steps:
      - wait: {selector: '#comic img'}
      - inspect: {selector: '#comic img', selects: '^<img'}
    crop: {window: true}
    drifts: true
    legacy:
      captured: 2026-09-22
      method: Chrome for Testing 154, headed on Xvfb, right-click > Inspect on the comic with real clicks (xdotool), DevTools docked right, grabbed with ImageMagick import
      note: The selected img has the hover joke in its title attribute and the comic's name in alt.

  - id: playwright-codegen
    kind: capture
    section: "Recording a Script with Codegen"
    url: https://quotes.toscrape.com/
    mode: headed        # two windows: the browser and the Playwright Inspector
    engine: codegen
    legacy:
      captured: 2026-09-22
      method: playwright codegen --target python (Playwright 1.63, its bundled Chrome for Testing 153), headed on Xvfb, grabbed with ImageMagick import
      note: After two recorded clicks (the tag "change", then an "(about)" link), hovering the author's name shows the locator codegen would use.
