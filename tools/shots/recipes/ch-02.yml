# Recipes for Chapter 2's figures (ch-02-ethics.qmd). See tools/shots/README.md.
#
# The third chapter of the back-fill after the chapter 5 pilot
# (docs/plans/2026-09-24-screenshot-backfill-ch01-05.md, §4): primary sources,
# each loaded signed out. Left out for now:
#
# - 2-2, Reddit's robots.txt, is captured and approved (2026-09-25), but its figure
#   block waits for the Friday review: pull requests #50, #63, and #79 revise the
#   paragraphs it sits beside.
# - 2-4, a browser's own request headers: chapter 5's network-headers figure
#   already shows the Headers pane, and captures send the course's User-Agent
#   rather than Chrome's, so they can't show "what a real browser sends".
# - 2-5, a platform's terms of service: optional, and the chapter names no one
#   platform's clause.
chapter: ch-02
qmd: ch-02-ethics.qmd
defaults:
  window: [800, 600]
  scale: 2

figures:
  - id: robots-txt-wikipedia
    kind: capture
    section: "Technical Norms: `robots.txt`"
    brief: >-
      Show the file the chapter's first request fetches, as a browser shows it:
      Wikipedia's robots.txt at its generic block, the rules the code's comments
      quote. The comment that welcomes "friendly, low-speed bots" on article
      pages but not dynamic ones (marker 1), User-agent: * (2), the Allow
      exceptions (3), and the Disallow rules for /w/, /api/, /trap/, and
      /wiki/Special: (4). Leave out the bot-specific blocks above and the
      other languages' rules below.
    url: https://en.wikipedia.org/robots.txt
    steps:
      # The whole file is one <pre>, so its lines are found by `match`.
      - scroll: {match: '^# Friendly, low-speed bots', in: 'pre', offset: 24}
    expect:
      text: ['User-agent: \*']
    crop: {top: 0, width: 600, height: 460}   # to the end of the last Disallow line shown
    annotate:
      marks:
        - {n: 1, at: {match: '^# Friendly, low-speed bots.*\n# dynamically-generated pages please\.$', in: 'pre'}}
        - {n: 2, at: {match: '^User-agent: \*$', in: 'pre'}}
        - {n: 3, shape: brace, at: {match: '^Allow: /w/api\.php.*(?:\nAllow: .*)*', in: 'pre'}}
        - {n: 4, shape: brace, at: {match: '^Disallow: /w/$(?:\nDisallow: .*){3}', in: 'pre'}}
    drifts: true        # Wikipedia edits the file

  - id: wikimedia-ua-policy
    kind: capture
    section: "Responsible Request Headers"
    brief: >-
      Show the rule behind the chapter's User-Agent header, in Wikimedia's own
      policy: bots should send a User-Agent that identifies them and gives a way
      to contact the operator (marker 1); the policy's example (2); and its
      generic format, <client name>/<version> (<contact information>) (3), the
      shape of this book's WebDataScience/1.0 (your-email@colorado.edu). The
      text column only: the policy's navigation box beside it adds nothing.
    url: https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy
    window: [800, 700]
    steps:
      - wait: {text: 'The generic format is'}
      # The paragraph's first line, below the page's floating contents button.
      - scroll: {match: 'This change is most likely to affect scripts', in: '.mw-parser-output', offset: 72}
    expect:
      text: ['contacting you, the operator']
    # The text column only, to the end of the paragraph on the generic format.
    crop: {top: 60, left: 0, width: 460, height: 540}
    annotate:
      marks:
        # Each at the left of its block: a marker aimed at a phrase mid-line would need
        # a leader line across the text.
        - {n: 1, at: {selector: '.mw-parser-output p:has-text("If you operate a bot")'}, side: left, gap: 2}
        - {n: 2, at: {selector: '.mw-parser-output pre', nth: 0}, side: left, gap: 2}
        - {n: 3, at: {selector: '.mw-parser-output p:has-text("The generic format is")'}, side: left, gap: 2}
    drifts: true        # the policy is edited from time to time

  - id: robots-txt-reddit
    kind: capture
    section: "Comparing robots.txt Across Platforms"
    brief: >-
      Show the chapter's shortest file, whole, as a browser shows it: Reddit's
      robots.txt, the eight lines the paragraph counts. The comment block points
      to the Public Content Policy and to the researchers' program, then
      User-agent: * and Disallow: / close every path to every crawler. Nothing
      marked: the file is short enough to read.
    url: https://www.reddit.com/robots.txt
    window: [600, 400]
    steps:
      - wait: {text: 'Disallow: /'}
    expect:
      text: ['User-agent: \*', 'Public Content Policy']
    crop: {selector: 'pre', pad: 8}     # the whole file, with the page's own margin
    drifts: true        # Reddit edits the file
