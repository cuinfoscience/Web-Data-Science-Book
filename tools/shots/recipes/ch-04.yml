# Recipes for Chapter 4's figures (ch-04-data-formats.qmd). See tools/shots/README.md.
#
# The first chapter of the back-fill after the chapter 5 pilot
# (docs/plans/2026-09-24-screenshot-backfill-ch01-05.md, §4). Chrome shows an
# XML file that has no stylesheet as a tree; the first two figures show real XML
# that way, and the third finds a feed's address in a page's source. The fourth,
# the chapter's Open-Meteo forecast in Chrome's JSON view, is an API's response:
# api.open-meteo.com's robots.txt disallows every path, and it is captured as an
# API client (docs/decisions.md, 2026-09-24). Left out:
#
# - The Guardian and the BBC's main site: their robots.txt files disallow Claude's
#   agents, and the back-fill honored that, so no figure comes from them. Since
#   2026-09-24, captures follow the rules for the course's User-Agent instead
#   (docs/decisions.md). The BBC's feeds are on feeds.bbci.co.uk, which allows
#   every agent.
chapter: ch-04
qmd: ch-04-data-formats.qmd
defaults:
  window: [800, 600]
  scale: 2

figures:
  - id: house-xml-tree
    kind: capture
    section: "Working with Real XML"
    brief: >-
      Show the real House roster as Chrome shows an XML file with no stylesheet:
      <MemberData publish-date=...> (marker 1), <members> (2), the first <member>
      (3) with its <member-info> (4) in full, then the second <member> (3 again),
      so the reader sees that the live file has the synthetic example's shape and
      that <member> repeats. Fold two blocks with Chrome's own triangles, and say
      so in the caption: <title-info>, which the synthetic example leaves out, and
      the first member's <committee-assignments>, which the chapter ignores. Leave
      out Chrome's note about style information above the tree.
    url: https://clerk.house.gov/xml/lists/MemberData.xml
    window: [800, 680]  # room for 591 pixels of tree below Chrome's note
    steps:
      - wait: {text: 'MemberData'}
      # A fold triangle is the span before its element's opening tag, found by
      # the tag's exact text; the first match is the one nearest the top. (CSS
      # :has() with :text-is() took more than a minute on this 18,000-line tree.)
      - click: {selector: 'text="<title-info>" >> xpath=preceding-sibling::*[1]'}
      - click: {selector: 'text="<committee-assignments>" >> xpath=preceding-sibling::*[1]'}
      - wait: {selector: 'text="<committee-assignments>" >> xpath=../../*[contains(@class,"folded") and not(contains(@class,"hidden"))]'}
    expect:
      status: 200
      text: ['<committee-assignments>']
    # From just above the root tag, below Chrome's note, to the end of the
    # second <member>'s line.
    crop: {selector: 'div.pretty-print', pad: [6, 0, 0, 20], width: 800, height: 591}
    annotate:
      marks:
        - {n: 1, at: {text: '^<MemberData ', box: first-line}}
        - {n: 2, at: {text: '^<members>$'}}
        - {n: 3, at: {text: '^<member>$', nth: 0}}
        - {n: 4, at: {text: '^<member-info>$', nth: 0}}
        - {n: 3, at: {text: '^<member>$', nth: 1}}
    drifts: true        # the publish date and the roster change

  - id: forecast-json
    kind: capture
    section: "Handling Deeply Nested JSON"
    brief: >-
      Show what the chapter's Open-Meteo request returns when its full URL (the
      one print(response.url) shows) is pasted into Chrome, with Pretty-print
      ticked: the whole response, so the reader sees the nesting the code walks.
      daily_units (marker 1) holds each list's unit; daily (2) holds the data,
      where time (3, a brace over the list) and temperature_2m_max (4) are
      parallel lists, one entry per day.
    url: https://api.open-meteo.com/v1/forecast?latitude=40.01&longitude=-105.27&daily=temperature_2m_max%2Ctemperature_2m_min&timezone=America%2FDenver
    api_client: true      # robots.txt disallows every path; see the header
    window: [600, 520]    # wide enough that the temperature lines don't wrap
    steps:
      - wait: {selector: 'pre'}
      # Pretty-print's checkbox is in a closed shadow root, which no selector reaches,
      # so it is clicked where Chrome draws it; the next step checks that it worked.
      - click: {position: [104, 9]}
      - wait: {text: '"daily": \{'}
    expect:
      text: ['"temperature_2m_max": \[']
    # Chrome's Pretty-print bar through the last brace. The body starts 13 pixels down
    # (its margin and the <pre>'s collapse), so the crop starts at the bar itself.
    crop: {between: ['.json-formatter-container', 'pre'], pad: [0, 0, 8, 0]}
    annotate:
      marks:
        - {n: 1, at: {match: '^\s*"daily_units": \{$', in: 'pre'}}
        - {n: 2, at: {match: '^\s*"daily": \{$', in: 'pre'}}
        - {n: 3, shape: brace, at: {match: '^\s*"time": \[(?:\n.*){8}', in: 'pre'}}
        - {n: 4, at: {match: '^\s*"temperature_2m_max": \[.*$', in: 'pre'}}
    drifts: true          # a new forecast every day

  - id: rss-feed-xml
    kind: capture
    section: "Recommended Exercises"
    brief: >-
      Show a news feed as Chrome shows it, for Step 2's "identify the repeating
      element by eye": <rss> (marker 1), <channel> (2) with the feed's title,
      description, and link, then the first <item> (3) in full and the second
      <item> (3 again). The feed is BBC News's science and environment feed, a
      section feed of a starter outlet, chosen for headlines that aren't
      political. Fold the channel's <image> and <copyright> with Chrome's
      triangles, and say so in the caption. The CDATA wrappers are real; the
      caption says what they are.
    url: https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    window: [800, 700]  # room for 600 pixels of tree below Chrome's note
    steps:
      - wait: {text: '^<item>$'}
      # Fold triangles found as in house-xml-tree.
      - click: {selector: 'text="<image>" >> xpath=preceding-sibling::*[1]'}
      - click: {selector: 'text="<copyright>" >> xpath=preceding-sibling::*[1]'}
      - wait: {selector: 'text="<copyright>" >> xpath=../../*[contains(@class,"folded") and not(contains(@class,"hidden"))]'}
    expect:
      status: 200
      text: ['<channel>', '<item>']
    # From just above <rss>, below Chrome's note, to the second <item>'s line.
    crop: {selector: 'div.pretty-print', pad: [2, 0, 0, 20], width: 800, height: 600}
    annotate:
      marks:
        - {n: 1, at: {text: '^<rss ', box: first-line}}
        - {n: 2, at: {text: '^<channel>$'}}
        - {n: 3, at: {text: '^<item>$', nth: 0}}
        - {n: 3, at: {text: '^<item>$', nth: 1}}
    drifts: true        # the headlines change through the day

  - id: view-source-rss-link
    kind: capture
    section: "Recommended Exercises"
    brief: >-
      Show how to find a feed the site doesn't advertise: View Source of PBS
      NewsHour's home page, searched with Chrome's find bar for
      application/rss+xml, which lands on line 33's <link rel="alternate">
      naming the feed's address (marker 1). The address bar's
      view-source: prefix and the find bar's query stay in view; the rest of the
      source, including line 31's long JSON script, stays out.
    url: view-source:https://www.pbs.org/newshour/
    mode: headed
    window: [816, 600]  # the page's scrollbar falls just outside an 800-pixel crop
    steps:
      - wait: {text: 'application/rss\+xml'}
      - click: {selector: 'input[type="checkbox"]'}     # Line wrap
      - key: 'ctrl+f'
      - type: 'application/rss+xml'
      # Chrome centers the match. Put line 32 below the find bar instead, with
      # four whole rows of line 31's script above it, beside the find bar.
      - scroll: {selector: 'td.line-number[value="32"]', offset: 60}
    # From the top of the toolbar (below the tab strip) to the end of line 33,
    # and the page's width without its scrollbar.
    crop: {top: 42, width: 800, height: 159}
    annotate:
      marks:
        # Beside the feed's address, at the end of line 33's first row. (A box
        # around the whole line covered its line number.)
        - {n: 1, at: {selector: 'td.line-number[value="33"] + td', box: first-line}}
    drifts: true        # the page's source changes with each release of the site
