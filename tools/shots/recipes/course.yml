  - id: week08-requests-vs-browser
    kind: capture
    section: "week-08 slides, Zero bytes (requests_vs_browser.png)"
    brief: >-
      Show quotes.toscrape.com/js/ with JavaScript off and on, side by side and
      labeled: off has only the title, Login, Next, and the footer; on has the
      quotes. Wide and short, for a frame that shows it at 78% of the slide's
      text width above two paragraphs.
    url: https://quotes.toscrape.com/js/
    mode: composite
    window: [480, 350]
    parts:
      - label: JavaScript off
        javascript: false
        steps: [{wait: {text: 'Quotes to Scrape'}}]
      - label: JavaScript on
        steps: [{wait: {text: 'Albert Einstein'}}]
    layout: {gap: 20, pad: 15, label_px: 20}
    oversize: "two 480-pixel pages side by side, 410 tall, for a frame that shows them at 78% of the slide's text width; their 14-pixel text comes to 18 there"
    targets: {slides: {width: 0.78}}

