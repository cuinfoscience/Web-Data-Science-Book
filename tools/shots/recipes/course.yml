# Course-only figures: made with tools/shots for the INFO 4617 course repo, not
# for a chapter. `promote` refuses them (their images live in the course repo;
# `sync`, milestone M4, will copy them there), and `check` only validates them.
#
# The two figures here rebuild, from recipes, the week-06 Oscars handout's
# annotated screenshots, which were captured and marked up by hand on
# 2026-09-24 (handouts/week-06/img/oscars_card_annotated.tex and
# oscars_devtools_annotated.tex). They are the regression test for markers
# (milestone M3): each marker comes from the element it points at, measured
# at capture time, and should land within a few pixels of the hand-placed one.
# The week-06 files themselves stay untouched.
chapter: course
course: true
qmd: none

figures:
  - id: oscars-card
    kind: capture
    section: "week-06 handout, Figure 1"
    brief: >-
      Show the first award-category card, with markers on the parts the handout's
      steps name: the categories field (1), a category card (2), its name (3), an
      honoree (4), and the honoree's type, name, and film (5-7). The markers must
      land where the hand-made version put them.
    url: https://www.oscars.org/oscars/ceremonies/2026
    window: [1680, 1947]          # the hand capture's viewport
    scale: 2
    steps:
      - click: {text: '(?i)^\s*(use )?necessary cookies only\s*$'}     # Cookiebot: necessary only
      - wait: {text: '(?i)michael b\. jordan'}
      - scroll: {selector: 'div.paragraph--type--award-category', offset: 175}
    # The first card and the top of the next, from 18.5 CSS pixels left of the card.
    crop: {selector: 'div.paragraph--type--award-category', pad: [13, 0, 0, 18.5], width: 560, height: 595}
    targets: {handout: {width_in: 2.625}}
    annotate:
      width_in: 2.625
      size: small
      marks:
        - {n: 3, at: {selector: '.paragraph--type--award-category .field--name-field-award-category-oscars', box: text}}
        - {n: 5, at: {selector: '.paragraph--type--award-honoree .field--name-field-honoree-type', box: text}, column: honoree}
        - {n: 6, at: {selector: '.paragraph--type--award-honoree .field--name-field-award-entities .field__item', box: text}, column: honoree}
        - {n: 7, at: {selector: '.paragraph--type--award-honoree .field--name-field-award-film', box: text}, column: honoree}
        - {n: 4, shape: brace, at: {selector: '.paragraph--type--award-honoree'}, x: 202.5}
        - {n: 2, shape: brace, at: {selector: '.paragraph--type--award-category'}, x: -40}
        - {n: 1, shape: bracket, at: {selector: '.field--name-field-award-categories'}, x: -1}
    notes: >-
      Markers 5-7 share a column past the longest of their three lines; the
      honoree's and the card's braces are pinned where the hand version put
      them, in the empty right half of the card.

  - id: oscars-devtools
    kind: capture
    section: "week-06 handout, Figure 2"
    brief: >-
      Show the same card's markup in the Elements tree, zoomed to 175% so it
      prints legibly at 5 inches: markers 1-7 beside the rows whose class names
      the handout's code uses, a label on the name the reader clicked, and one
      brace for the four collapsed honorees.
    url: https://www.oscars.org/oscars/ceremonies/2026
    mode: headed
    window: [1680, 2090]          # the hand capture's window
    scale: 1
    devtools: {dock: bottom, zoom: 1.75, size: 1300, sidebar: hidden}
    steps:
      - click: {text: '(?i)^\s*(use )?necessary cookies only\s*$'}
      - wait: {text: '(?i)michael b\. jordan'}
      - scroll: {selector: 'div.paragraph--type--award-category', offset: 175}
      - inspect: {selector: '.paragraph--type--award-honoree .field--name-field-award-entities .field__item', selects: 'Michael B'}
      # Open the film's <div class="field">, three rows down, then select the name again.
      - tree: {keys: [Down], until: '^<div class="field">\W*</div>$', max: 6}
      - tree: {keys: [Right]}
      - inspect: {selector: '.paragraph--type--award-honoree .field--name-field-award-entities .field__item', selects: 'Michael B'}
    crop: {left: 300, top: 998, width: 1040, height: 824}
    oversize: "DevTools is zoomed to 175%, so its text reads as a 594×471 capture's would"
    targets: {handout: {width_in: 5.04}}
    annotate:
      width_in: 5.04
      marks:
        - {n: 1, at: {devtools: {row: 'field--name-field-award-categories'}}, side: left, x: 30, gap: 7}
        - {n: 2, at: {devtools: {row: 'paragraph--type--award-category'}}, side: left, x: 30, gap: 7}
        - {n: 3, at: {devtools: {row: 'field--name-field-award-category-oscars'}}, side: left, x: 30, gap: 7}
        - {n: 4, at: {devtools: {row: 'paragraph--type--award-honoree'}}, side: left, x: 30, gap: 7}
        - {n: 5, at: {devtools: {row: 'field--name-field-honoree-type'}}, side: left, x: 30, gap: 7}
        - {n: 6, at: {devtools: {row: 'field--name-field-award-entities'}}, side: left, x: 30, gap: 7}
        - {n: 7, at: {devtools: {row: 'field--name-field-award-film'}}, side: left, x: 30, gap: 7}
        - {label: '← you clicked', at: {devtools: {selected: true}}, x: -4}
        - {n: 4, shape: brace, label: '4 more honorees', at: {devtools: {row: '^<div class="field__item">\W*</div>$', nth: [0, 3]}}, gap: 13}
    notes: >-
      Seven markers in the left margin, each led to the row of a class name the
      handout's code uses; the four collapsed honorees are one brace.

  # Week 7's slides (the course repo's slides/week-07/img/). The deck's crops of
  # 2026-09-22, cut from 1,280- and 1,680-pixel windows, showed their text at 6 to
  # 15 pixels on a 1,920-pixel slide. Each recipe here crops to what its frame
  # discusses, at the width the frame gives it (`targets: {slides: {width: ...}}`),
  # so the text can reach 16. `about_capture.png` is a copy of chapter 7's
  # about-this-capture.png, which already does. The Wayback toolbar keeps its parts
  # in a closed shadow root; the figures that wait for its capture count open it
  # (`open_shadow: true`; see recipes/ch-07.yml and the README's field notes).

  - id: week07-wayback-calendar
    kind: capture
    section: "week-07 slides, Finding a capture (wayback_calendar.png)"
    brief: >-
      Show what the frame describes: the Calendar tab's bars of captures per year
      for facebook.com, taller where a year holds more captures, with 2005
      selected, and the first row of 2005's calendar, where dots of different
      sizes mark the days with captures.
    url: https://web.archive.org/web/2005*/facebook.com
    window: [800, 700]
    steps:
      # The summary line joins its words with no-break spaces, which \s matches.
      - wait: {text: 'Saved\s[0-9,]+\stimes'}
      - wait: {network_idle: true}
    expect:
      text: ['Saved\s[0-9,]+\stimes']
    # From the bars to the bottom of January to March, as wide as the bars.
    crop: {between: ['.sparkline-container', '.calendar-grid .month:nth-child(3)'], left: 30, width: 740,
           pad: [4, 0, 2, 0]}
    targets: {slides: {width: 0.72}}     # 0.78 ran the frame 11.5 points past the slide's foot
    drifts: true        # the bars and the dots change as captures are added

  - id: week07-toolbar
    kind: capture
    section: "week-07 slides, Moving through time (toolbar.png)"
    brief: >-
      Show the Wayback toolbar on facebook.com's January 21, 2004 capture, from
      the address box to the date: the address, the count of captures, the strip
      of bars across the years, and the big yellow date between its arrows and
      the neighboring months and years. Leave out the logo and the buttons,
      which the frame doesn't mention, so the strip can be shown larger.
    url: https://web.archive.org/web/20040121224607/http://facebook.com/
    # The strip of bars appears only in a window 1,100 pixels wide or more; at 1,280
    # it doesn't overlap the count.
    window: [1280, 300]
    open_shadow: true
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: '[0-9,]+ captures'}
      - wait: {network_idle: true}
    # The crop is the toolbar alone, so the page's own images and stylesheets, which the
    # archive answered with 502 or aborted on every load on 2026-09-25, don't show.
    expect:
      text: ['[0-9,]+ captures']
      all_files: false
    crop: {top: 0, height: 68, left: 130, width: 1040}
    oversize: >-
      a thin strip shown at the slide's full width (AUTHORING.md): the strip of
      bars needs the toolbar at 1,280 pixels
    legibility:
      skip: >-
        the date range under the count is 9 pixels in the toolbar at any width, a
        third of the strip's few words, and it comes to 14.5 pixels on the slide;
        what the frame discusses, the count and the date, reads at 19 and more
    targets: {slides: {width: 1.0}}
    drifts: true        # the count, its date range, and the strip

  - id: week07-calendar-dots
    kind: capture
    section: "week-07 slides, Reading the dots (calendar_dots_2005.png)"
    brief: >-
      Show where the dots on facebook.com's 2005 calendar change color: April,
      blue on the 6th and 8th and orange from the 10th, and August, orange to
      the 4th and blue from the 6th. One month wide, so the dots and their day
      numbers stay large in the frame's narrow column, and only the weeks where
      the color changes, so the pair fits the slide's height.
    url: https://web.archive.org/web/2005*/facebook.com
    mode: composite
    window: [800, 1100]       # tall enough to hold August's row, which the crop is cut from
    parts:
      - label: April 2005
        steps: [{wait: {text: 'Saved\s[0-9,]+\stimes'}}, {wait: {network_idle: true}}]
        expect: {text: ['Saved\s[0-9,]+\stimes']}
        crop: {selector: '.calendar-grid .month:nth-child(4)', height: 120}     # the title and April 1-16
      - label: August 2005
        steps: [{wait: {text: 'Saved\s[0-9,]+\stimes'}}, {wait: {network_idle: true}}]
        expect: {text: ['Saved\s[0-9,]+\stimes']}
        crop: {selector: '.calendar-grid .month:nth-child(8)', height: 92}      # the title and August 1-13
    layout: {direction: column, gap: 10, pad: 8, label_px: 14}
    targets: {slides: {width: 0.35}}

  - id: week07-x-com-1999
    kind: capture
    section: "week-07 slides, Broken captures and x.com before X (x_com_1999.png)"
    brief: >-
      Show x.com's November 14, 1999 page with its images broken: the big
      image's broken icon, the four navigation images (About X.com, Managment
      Team, Employment Opportunities, Contact Us) as broken icons with their alt
      text, and the logo's alt text, x.com, below. The page's top 560 by 410
      pixels, below the toolbar, so the alt text reaches 16 pixels in a column
      35% of the slide wide.
    url: https://web.archive.org/web/19991114081850/http://x.com/
    window: [700, 600]
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'X\.com Corporation'}
      - wait: {network_idle: true}
    # The page's images are broken whatever the archive answers: never saved, they get
    # 404s, and on most loads on 2026-09-25 some got 502s instead.
    expect:
      text: ['X\.com Corporation']
      all_files: false
    crop: {top: 71, height: 407, left: 0, width: 560}      # below the toolbar's shadow
    targets: {slides: {width: 0.35}}

  - id: week07-toolbar-counts
    kind: capture
    section: "week-07 slides, Why some sites are archived better (toolbar_counts.png)"
    brief: >-
      Show three toolbars stacked, google.com, facebook.com, and x.com, each with
      its count of captures and its strip of captures by year, so the counts
      (tens of millions against tens of thousands) and the strips' density can
      be compared. Each strip's label names its site, so the address row, the
      logo, the date, and the buttons are left out, and the three fit the frame
      above its text.
    mode: composite
    window: [1280, 300]
    open_shadow: true
    parts:
      - label: google.com
        url: https://web.archive.org/web/19981111184551/http://google.com/
        steps: [{wait: {selector: '#wm-ipp-base'}}, {wait: {text: '[0-9,]+ captures'}}, {wait: {network_idle: true}}]
        expect: {text: ['[0-9,]+ captures'], all_files: false}      # the toolbar alone is cropped
        crop: {top: 28, height: 32, left: 130, width: 930}
      - label: facebook.com
        url: https://web.archive.org/web/20040121224607/http://facebook.com/
        steps: [{wait: {selector: '#wm-ipp-base'}}, {wait: {text: '[0-9,]+ captures'}}, {wait: {network_idle: true}}]
        expect: {text: ['[0-9,]+ captures'], all_files: false}      # the toolbar alone is cropped
        crop: {top: 28, height: 32, left: 130, width: 930}
      - label: x.com
        url: https://web.archive.org/web/19991114081850/http://x.com/
        steps: [{wait: {selector: '#wm-ipp-base'}}, {wait: {text: '[0-9,]+ captures'}}, {wait: {network_idle: true}}]
        expect: {text: ['[0-9,]+ captures'], all_files: false}      # the toolbar alone is cropped
        crop: {top: 28, height: 32, left: 130, width: 930}
    layout: {direction: column, gap: 8, pad: 8, label_px: 14}
    oversize: >-
      three thin strips, shown at 90% of the slide's width: the strips of bars
      need the toolbar at 1,280 pixels
    legibility:
      skip: >-
        each toolbar's date range is 9 pixels at any width and comes to 14.4 pixels
        on the slide; the counts the frame compares read at 19 and more
    targets: {slides: {width: 0.9}}
    drifts: true        # the counts and the strips

  - id: week07-devtools-archived
    kind: capture
    section: "week-07 slides, The Inspector still works (devtools_archived.png)"
    brief: >-
      Show the Elements tree on Thefacebook's February 12, 2004 capture, zoomed
      to 175% for a column 45% of the slide wide: in the body, the toolbar's
      div#wm-ipp-base, the second div and the script, the END WAYBACK TOOLBAR
      INSERT comment, and the page's own <center>, selected. DevTools alone;
      the frame's text says where the tree comes from.
    url: https://web.archive.org/web/20040212031928/http://www.thefacebook.com/
    mode: headed
    window: [800, 1000]
    devtools: {dock: bottom, size: 640, zoom: 1.75, panel: elements, layout: stacked, sidebar: 1}
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'Welcome to Thefacebook'}
      # As in ch-07's devtools-archived-page: <center>'s empty left margin, a third
      # of the way down, below the pinned toolbar.
      - inspect: {selector: 'center', at: [0.02, 0.3], selects: '^<center'}
    expect:
      text: ['Welcome to Thefacebook']
    # DevTools takes the window's lower 639 pixels: from its tab bar to just below </html>,
    # without the empty rows, the breadcrumb bar, and the Styles pane's tabs.
    crop: {top: 361, height: 368}
    targets: {slides: {width: 0.45}}

  - id: week07-wrapped-vs-raw
    kind: capture
    section: "week-07 slides, Raw or wrapped? (wrapped_vs_raw.png)"
    brief: >-
      Show the top of one capture's source twice, labeled: wrapped
      (/web/20040212031928/), which starts with the archive's scripts, and raw
      (/web/20040212031928id_/), which starts with Thefacebook's own <style>.
      Lines wrap rather than run off the edge, in a window narrow enough for a
      column 48% of the slide wide.
    mode: composite
    # 636 wide puts View Source's scrollbar just past a 620-pixel crop; with the frame's
    # padding the pair is 636 wide, where its 13-pixel text reaches 16.5 on the slide.
    window: [636, 560]
    parts:
      - label: 'Wrapped: /web/20040212031928/'
        url: view-source:https://web.archive.org/web/20040212031928/http://www.thefacebook.com/
        mode: headed
        steps:
          - wait: {text: 'wombat'}
          - click: {selector: 'input[type="checkbox"]'}      # Line wrap
        crop: {between: ['td.line-number[value="1"]', 'td.line-number[value="7"]'], width: 620}
      - label: 'Raw: /web/20040212031928id_/'
        url: view-source:https://web.archive.org/web/20040212031928id_/http://www.thefacebook.com/
        mode: headed
        steps:
          - wait: {text: 'font-size: 18px'}
          - click: {selector: 'input[type="checkbox"]'}      # Line wrap
        crop: {between: ['td.line-number[value="1"]', 'td.line-number[value="9"]'], width: 620}
    layout: {direction: column, gap: 10, pad: 8, label_px: 14}
    targets: {slides: {width: 0.48}}

  - id: week07-facebook-2004
    kind: capture
    section: "week-07 slides, Facebook before Facebook (facebook_2004.png)"
    brief: >-
      Show the two things the frame quotes from AboutFace's facebook.com of
      January 21, 2004, stacked and labeled: its logo and tagline, "The first
      name in directories", and its pitch to schools and colleges, "Eliminate
      the need for printed facebooks." Each is a small crop, so the page's
      11-pixel text reaches 16 pixels in a column 44% of the slide wide.
    url: https://web.archive.org/web/20040121224607/http://facebook.com/
    mode: composite
    window: [778, 600]
    parts:
      - label: AboutFace's banner
        steps: [{wait: {text: 'AboutFace'}}, {wait: {network_idle: true}}]
        expect: {text: ['AboutFace'], all_files: false}       # judged by eye: the banner must be drawn
        crop: {top: 67, height: 95, left: 0, width: 240}
      - label: its pitch to colleges
        steps: [{wait: {text: 'Eliminate the need for printed facebooks'}}, {wait: {network_idle: true}}]
        expect: {text: ['Eliminate the need for printed facebooks'], all_files: false}
        crop: {top: 333, height: 60, left: 455, width: 255}
    layout: {direction: column, gap: 10, pad: 8, label_px: 13}
    targets: {slides: {width: 0.4416}}

  - id: week07-thefacebook-2004
    kind: capture
    section: "week-07 slides, Facebook before Facebook (thefacebook_2004.png)"
    brief: >-
      Show Thefacebook on February 12, 2004, eight days after launch: its
      "[ thefacebook ]" banner and the welcome box, "Thefacebook is an online
      directory that connects people through social networks at colleges," open
      only at Harvard University. The page's right-hand 550 pixels, so its
      13-pixel text reaches 16 pixels in a column 44% of the slide wide.
    url: https://web.archive.org/web/20040212031928/http://www.thefacebook.com/
    window: [800, 600]
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'Harvard University'}
      - wait: {network_idle: true}
    expect:
      text: ['Welcome to Thefacebook', 'Harvard University']
    crop: {top: 72, height: 222, left: 209, width: 546}
    targets: {slides: {width: 0.4416}}

  - id: week07-x-com-1997
    kind: capture
    section: "week-07 slides, x.com before X (x_com_1997.png)"
    brief: >-
      Show x.com on April 11, 1997: "not nearly the worst place on the web!!!"
      under a missing image, and "Check out these cool attractions:" with Dave's
      World and Rob's House of Weather. The page below the toolbar, 730 pixels
      wide for a column 48% of the slide wide.
    url: https://web.archive.org/web/19970411224438/http://x.com/
    window: [800, 600]
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'not nearly the worst place'}
      - wait: {network_idle: true}
    # The page's background image resolves to a 2013 capture the archive answered with
    # 500 on every load on 2026-09-25; the page's own background color shows instead.
    expect:
      text: ['not nearly the worst place on the web', "Rob's House of Weather"]
      all_files: false
    crop: {top: 70, height: 420, left: 0, width: 730}
    targets: {slides: {width: 0.48}}

  - id: week07-google-1998
    kind: capture
    section: "week-07 slides, google.com, November 1998 (google_1998.png)"
    brief: >-
      Show google.com's first capture, November 11, 1998, under the Wayback
      toolbar with its count of captures today: "Welcome to Google" and its two
      links, the Google Search Engine Prototype and the "Might-work-some-of-the-
      time-prototype that is much more up to date."
    url: https://web.archive.org/web/19981111184551/http://google.com/
    window: [800, 600]
    open_shadow: true
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'Welcome to Google'}
      - wait: {text: '[0-9,]+ captures'}
      - wait: {network_idle: true}
    expect:
      text: ['Welcome to Google', 'Might-work-some-of-the-time', '[0-9,]+ captures']
    crop: {top: 0, height: 200, left: 0, width: 800}
    targets: {slides: {width: 0.85}}
    drifts: true        # the toolbar's count and date range

  # Week 8's slides (the course repo's slides/week-08/img/). Three of the deck's
  # screenshots of 2026-09-22/23 were taken in 900- and 1,280-pixel windows, one
  # image pixel per CSS pixel, for frames that show them at 35% or 78% of the
  # slide's text width: their text came to 7 to 11 pixels on a 1,920-pixel slide.
  # The first three recipes below take the same pages at 480 pixels, where it
  # reaches 18 to 20. `week08-selenium-browser` crops the window Selenium opens
  # (`engine: selenium`); codegen.png is a copy of chapter 8's figure 8.6, whose
  # recipe names the slide. pr_review.png waits for a session that can read
  # github.com's robots.txt (a cloud session reaches github.com only for its own
  # repositories). quotes.toscrape.com is a sandbox built for scraping practice
  # and has no robots.txt.
  - id: week01-book-website
    kind: capture
    section: "week-01 slides, A book built for this course (book_website.png)"
    brief: >-
      Show the course's textbook as students first meet it: its website,
      loaded narrow, with the chapter list open, so the frame's "one chapter
      per week" has its chapters to point at. The list alone, from Preface
      through chapter 15, in its four parts (Foundations, Documents, APIs,
      Practice); leave out the page grayed behind it and the appendices.
      Narrow, for a column 35% of the slide wide.
    url: https://cuinfoscience.github.io/Web-Data-Science-Book/
    window: [480, 760]
    steps:
      - wait: {text: 'Retrieving, Parsing, and Analyzing Data'}
      - click: {selector: 'button.quarto-btn-toggle'}     # the chapter list, folded away at this width
      - wait: {text: 'Introduction to Web Data Science'}
      - settle: 1
    expect: {text: ['Web Data Science', 'Research Design with Web Data']}
    # The open list is 390 pixels wide. Preface's row starts at 134 and chapter 15's ends
    # at 627, measured 2026-09-25; the window is 760 tall so all of it is drawn. Title
    # and list together would be too tall for a 35% column (1.5 times its width).
    crop: {top: 124, left: 0, width: 388, height: 512}
    targets: {slides: {width: 0.35}}
    drifts: true        # the book's chapters and the site's look

  # Hand captures (mode: hand; README, "Hand captures"): screenshots the maintainer takes,
  # brought in with `tools/shots/run import course <id> --file PNG --by NAME --date D`.
  # Their crop and redact boxes are set from the screenshot itself, before it is imported:
  # each column is 35% of the slide, so a crop wider than about 440 CSS pixels makes
  # 12-pixel text too small (text_px x 0.35 x 1680 / width must reach 16).
  - id: pr-review
    kind: capture
    mode: hand
    section: "week-01, week-08, and week-13 slides (pr_review.png)"
    brief: >-
      Show a pull request as a proposal that people comment on line by line:
      the Files changed view of a textbook pull request that isn't a student's,
      a changed line of a chapter's .qmd, and a review comment under it. One
      image serves weeks 1, 8, and 13, whose frames say the same thing beside
      it. Narrow, for a column 35% of the slide wide.
    url: https://github.com/cuinfoscience/Web-Data-Science-Book/pull/50/files
    hand:
      why: >-
        writing the review comment needs a signed-in account, and the session
        can't reach github.com beyond its own repositories (robots.txt answers
        403 through its proxy)
      steps: >-
        Signed in, open the pull request's Files changed (#50, your own, edits
        ch-02-ethics.qmd; any pull request that isn't a student's will do) and
        leave a short review comment on one changed line. Open DevTools' device
        toolbar (Ctrl+Shift+M; Cmd+Shift+M on a Mac) at 480 x 800, zoom 100%,
        reload, and scroll so the line and the comment under it are in view.
        Save the screenshot with the device toolbar's menu, Capture screenshot.
        window.devicePixelRatio in the console is `scale`.
      text_px: 12          # GitHub's diff; its comments are 14
    window: [480, 800]
    scale: 2
    targets: {slides: {width: 0.35}}
    drifts: true           # GitHub's interface

  - id: week01-issue-form
    kind: capture
    mode: hand
    section: "week-01 slides, Your turn (issue_form.png)"
    brief: >-
      Show where a student files a problem: the textbook's Gap report form,
      filled in with the revision framework's worked example (Chapter 2,
      "Technical Norms: robots.txt": where to find a site's robots.txt), and not
      submitted. The title and the first fields; no account details. Narrow,
      for a column 35% of the slide wide.
    url: https://github.com/cuinfoscience/Web-Data-Science-Book/issues/new?template=gap-report.yml
    hand:
      why: GitHub's new-issue forms need a signed-in account, and the toolkit never signs in
      steps: >-
        Signed in, open the URL with DevTools' device toolbar at 480 x 800, zoom
        100%. Fill in the revision framework's gap report
        (handouts/common/revision-framework.md, "Filling in a form well"): the
        title "Gap: no explanation of where to find robots.txt", Ch. 2, the
        heading "Technical Norms: robots.txt", "Something was missing", and its
        "Where did you get stuck?" answer. Don't submit. Save the screenshot with
        the device toolbar's Capture screenshot; window.devicePixelRatio is `scale`.
      text_px: 14
    window: [480, 800]
    scale: 2
    targets: {slides: {width: 0.35}}
    drifts: true           # the form's fields and GitHub's interface

