  - id: week08-selenium-browser
    kind: capture
    section: "week-08 slides, Selenium: a browser you drive with code (selenium_browser.png)"
    brief: >-
      Show the top left of the window webdriver.Chrome() opens: its tab, the
      address bar, and Chrome for Testing's bar through "is only for automated
      testing.", above the top of xkcd. Narrow, for a column 35% of the slide wide.
    url: https://xkcd.com/
    mode: headed
    engine: selenium    # webdriver.Chrome(), as chapter 8 runs it (lib/engine_selenium.py)
    window: [800, 600]
    steps:
      - wait: {selector: '#comic img'}
    expect: {infobar: true, text: ['A webcomic of romance']}
    # The window's left 445 pixels end just after the bar's first sentence, and its top 288 under
    # xkcd's TW•FB•IG. Chrome's bars aren't in the page, so the take doesn't measure them: their
    # text, about 14 pixels (a capital is 10 tall), comes to about 18.5 on the slide.
    crop: {top: 0, left: 0, width: 445, height: 288}
    targets: {slides: {width: 0.35}}
    drifts: true        # xkcd's current comic and the browser version
