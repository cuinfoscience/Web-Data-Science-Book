# Recipes for Chapter 7's figures (ch-07-archives.qmd). See tools/shots/README.md.
#
# The Wayback Machine answers 502 or drops the connection on many first
# attempts; the toolkit retries politely (30, 60, then 120 seconds apart) and
# fails a take whose page says "Fail with status" or "upstream request failed".
# Its toolbar and calendar live in shadow DOM, which the text and CSS
# locators below reach into.
chapter: ch-07
qmd: ch-07-archives.qmd
defaults:
  window: [1280, 800]
  scale: 2

figures:
  - id: wayback-calendar
    kind: capture
    section: "Finding a Capture"
    brief: >-
      Show the Wayback Machine's Calendar for facebook.com with 2005 selected: the
      "Saved N times" line, the bar chart of captures per year, and enough months
      of calendar that circles of different sizes and colors both appear. The
      caption explains them: size is how many captures a day holds, color is the
      status code the crawler received.
    url: https://web.archive.org/web/2005*/facebook.com
    steps:
      - wait: {text: 'Saved [0-9,]+ times'}
      - wait: {network_idle: true}
    expect:
      text: ['Saved [0-9,]+ times']
    crop: {window: true}
    drifts: true        # "Saved N times" and the capture circles change every day
    legacy:
      captured: 2026-09-22
      method: headless Playwright (Node), 1280×800 window at 1×, the whole window
      note: Shows "Saved 8,461,424 times between December 12, 1998 and September 22, 2026."

  - id: facebook-2004
    kind: capture
    section: "Finding a Capture"
    brief: >-
      Show what a replayed capture looks like: facebook.com on January 21, 2004,
      two weeks before Thefacebook launched, when the domain belonged to
      AboutFace, with the Wayback toolbar across the top.
    url: https://web.archive.org/web/20040121224607/http://facebook.com/
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'AboutFace'}
    expect:
      text: ['AboutFace']
    crop: {window: true}
    legacy:
      captured: 2026-09-22
      method: headless Playwright (Node), 1280×800 window at 1×, the whole window

  - id: about-this-capture
    kind: capture
    section: "About This Capture"
    brief: >-
      Show the toolbar's About this capture panel on the February 12, 2004 capture
      of thefacebook.com: who collected the capture (Collected by) and when each
      embedded image was saved relative to the page (Timestamps). Only the toolbar
      and the panel. "Collected by" loads after the panel opens; the first take
      missed it, so wait for it.
    url: https://web.archive.org/web/20040212031928/http://www.thefacebook.com/
    steps:
      - wait: {selector: '#wm-ipp-base'}
      # The panel's "Collected by" section loads on hover (from /__wb/provenance),
      # so hover the control first, then open it and wait for that section.
      - hover: {text: '(?i)about this capture'}
      - click: {text: '(?i)about this capture'}
      - wait: {text: '(?i)collected by'}
    expect:
      text: ['(?i)collected by', '(?i)timestamps']
    crop: {top: 0, height: 240}
    legacy:
      captured: 2026-09-22
      method: headless Playwright (Node), 1280×800 window at 1×, top 240 pixels, after hovering and clicking About this capture by position
      note: 'Retaken 2026-09-22 (course PR #44) because the first take missed "Collected by".'

  - id: x-com-1999
    kind: capture
    section: "Broken and Missing Captures"
    brief: >-
      Show a capture whose HTML was saved but whose images were not: x.com on
      November 14, 1999, with broken-image icons and their alt text above the
      signup form and the X.com Corporation footer, under the Wayback toolbar.
    url: https://web.archive.org/web/19991114081850/http://x.com/
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'X\.com Corporation'}
    expect:
      text: ['X\.com Corporation']
    crop: {top: 0, height: 610}
    drifts: true        # the toolbar's capture count
    legacy:
      captured: 2026-09-22
      method: headless Playwright (Node), 1280×800 window at 1×, top 610 pixels
      note: >-
        The toolbar showed 83,190 captures. Why the images are broken: of the seven
        images the page references, six were only ever captured as 404s (CDX API,
        full query, not the first 25 rows; see course PR #44).

  - id: devtools-archived-page
    kind: capture
    section: "Inspecting Archived Pages"
    brief: >-
      Show the markup the Wayback Machine adds to a replayed page: on the February
      12, 2004 capture of thefacebook.com, the Elements tree lists the toolbar's
      div#wm-ipp-base first in the body, then the END WAYBACK TOOLBAR INSERT
      comment, then the page's own <center>. The page stays in view beside
      DevTools, so the reader can match the toolbar to its markup.
    url: https://web.archive.org/web/20040212031928/http://www.thefacebook.com/
    mode: headed
    window: [1680, 1000]
    devtools: {dock: right, panel: elements}
    steps:
      - wait: {selector: '#wm-ipp-base'}
      - wait: {text: 'Welcome to Thefacebook'}
      # Pick the 2004 page's own <center> in its empty left margin (the 700-pixel
      # table is centered inside it), so DevTools selects <center> itself. The body
      # then shows the toolbar insert, the comment that ends it, and Thefacebook's
      # markup. (Climbing from a word of the page takes three nested tables.)
      - inspect: {selector: 'center', at: [0.02, 0.5], selects: '^<center'}
    expect:
      text: ['Welcome to Thefacebook']
    crop: {top: 0, height: 615}
    legacy:
      captured: 2026-09-22
      method: Chrome on a virtual display (Xvfb) with DevTools docked right, grabbed with ImageMagick import
      note: The Elements panel shows div#wm-ipp-base, the END WAYBACK TOOLBAR INSERT comment, then the page's own center element.
