<p><b>Hillary Rodham Clinton</b> (born <a href="/wiki/October_26" title="October 26">October 26</a>, <a href="/wiki/1947" title="1947">1947</a>), was <a href="/wiki/First_Lady_of_the_United_States" title="First Lady of the United States">First Lady of the United States</a> from <a href="/wiki/1993" title="1993">1993</a> to <a href="/wiki/2001" title="2001">2001</a>, as the wife of <a href="/wiki/President_of_the_United_States" title="President of the United States">President</a> <a href="/wiki/Bill_Clinton" title="Bill Clinton">Bill Clinton</a>. She currently serves as the junior <a href="/wiki/United_States_Senate" title="United States Senate">United States Senator</a> from <a href="/wiki/New_York" class="mw-disambig" title="New York">New York</a>.
</p>
