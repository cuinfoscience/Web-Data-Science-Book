</p><p><b>Joseph Robinette "Joe" Biden, Jr.</b> (born <a href="/wiki/November_20" title="November 20">November 20</a>, <a href="/wiki/1942" title="1942">1942</a>) is an <a href="/wiki/United_States" title="United States">American</a> <a href="/wiki/Lawyer" title="Lawyer">lawyer</a> and <a href="/wiki/Politician" title="Politician">politician</a> from <a href="/wiki/Wilmington,_Delaware" title="Wilmington, Delaware">Wilmington</a>, <a href="/wiki/Delaware" title="Delaware">Delaware</a>, in <a href="/wiki/New_Castle_County" class="mw-redirect" title="New Castle County">New Castle County</a>. He is a member of the <a href="/wiki/U.S._Democratic_Party" class="mw-redirect" title="U.S. Democratic Party">Democratic Party</a> and is the incumbent senior <a href="/wiki/List_of_United_States_Senators_from_Delaware" class="mw-redirect" title="List of United States Senators from Delaware">U.S. Senator from Delaware</a>.
